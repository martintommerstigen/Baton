<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a35"><title>Baton Mobile</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#102a35;color:#eef5f7}
body{max-width:650px;margin:auto;padding:16px}h1{margin:12px 0}label{display:block;margin-top:14px;font-weight:600}
input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:12px;margin-top:6px}
input,textarea{background:#203e49;color:#fff;border:1px solid #6d919d}button{border:0;background:#54b5c3;color:#09232a;font-weight:700}
button.secondary{background:#294c58;color:#eef5f7}article{padding:12px;border:1px solid #496d78;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}
small{color:#bad2d8}#status{min-height:2em}textarea{min-height:100px}
</style></head><body>
<h1>Baton Mobile <small>v0.1</small></h1>
<p>En enkel meldingsklient for Android og andre telefoner. Ingen LLM-tilkobling ennå.</p>
<label>Din tilgangsnøkkel <input id="token" type="password" autocomplete="off" placeholder="Baton token"></label>
<button id="connect">Koble til / oppdater innboks</button>
<p id="status" role="status" aria-live="polite">Ikke tilkoblet</p>
<section><h2>Send melding</h2>
<label>Mottaker-ID <input id="recipient" autocomplete="off" placeholder="f.eks. siv"></label>
<label>Melding <textarea id="body" placeholder="Skriv en melding"></textarea></label>
<button id="send">Send</button></section>
<section><h2>Innboks</h2><div id="messages"></div></section>
<script>
"use strict";
let credential = "";
const $ = id => document.getElementById(id);
function status(text){$("status").textContent=text}
async function request(path, payload){
  if(!credential) throw Error("Koble til først");
  const response=await fetch(path,{method:payload?"POST":"GET",
    headers:{"Authorization":"Bearer "+credential,"Content-Type":"application/json"},
    body:payload?JSON.stringify(payload):undefined,cache:"no-store"});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||("HTTP "+response.status));
  return data;
}
async function refresh(){
  try{
    const data=await request("/v1/inbox");
    const root=$("messages");root.replaceChildren();
    for(const message of data.messages){
      const card=document.createElement("article");
      const sender=document.createElement("strong");sender.textContent=message.sender;
      const body=document.createElement("p");body.textContent=message.body;
      const meta=document.createElement("small");meta.textContent="ID: "+message.id;
      const ack=document.createElement("button");ack.className="secondary";ack.textContent="Kvitter som mottatt";
      ack.addEventListener("click",async()=>{
        try{await request("/v1/ack",{id:message.id});await refresh()}
        catch(error){status("Feil: "+error.message)}
      });
      card.append(sender,body,meta,ack);root.append(card);
    }
    status("Tilkoblet · "+data.messages.length+" ukvitterte meldinger");
  }catch(error){status("Feil: "+error.message)}
}
$("connect").addEventListener("click",()=>{
  credential=$("token").value.trim();$("token").value="";
  if(!credential){status("Tilgangsnøkkel mangler");return}
  refresh();
});
$("send").addEventListener("click",async()=>{
  const to=$("recipient").value.trim(),body=$("body").value.trim();
  if(!to||!body){status("Mottaker og melding kreves");return}
  try{
    const receipt=await request("/v1/send",{to,body});
    $("body").value="";
    status("Serverkvittering: "+receipt.status+" · "+receipt.id+" (ikke bevis for lest melding)");
  }catch(error){status("Feil: "+error.message)}
});
</script></body></html>
