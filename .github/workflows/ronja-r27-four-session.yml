name: Ronja R27 four-session observer kernel negatives
on:
  push:
    branches:
      - research/ronja-r27-four-session-seal-2026-11-11
    paths:
      - 'remote_security/sealed_observer_sessions.py'
      - 'tests/test_sealed_observer_sessions.py'
      - '.github/workflows/ronja-r27-four-session.yml'
  pull_request:
    paths:
      - 'remote_security/sealed_observer_sessions.py'
      - 'tests/test_sealed_observer_sessions.py'
      - '.github/workflows/ronja-r27-four-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact source
        run: python3 -m compileall -q remote_security/sealed_observer_sessions.py tests/test_sealed_observer_sessions.py
      - name: Real separate UID R25 + R26 + R27 kernel controls
        run: sudo python3 -m unittest discover -s tests -p 'test_sealed_observer_sessions.py' -v
