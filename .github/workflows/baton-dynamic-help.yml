name: Baton dynamic HOWTO FAQ and onboarding

on:
  push:
    branches:
      - feature/dynamic-peer-learning-ledger-2026-11-12
    paths:
      - 'baton_help_catalog.py'
      - 'baton_help_ui.py'
      - 'baton_onboarding.py'
      - 'baton_conversation_panel.py'
      - 'baton_model_bridge.py'
      - 'baton_core_window.py'
      - 'test_baton_help_*.py'
      - '.github/workflows/baton-dynamic-help.yml'
  pull_request:
    paths:
      - 'baton_help_catalog.py'
      - 'baton_help_ui.py'
      - 'baton_onboarding.py'
      - 'baton_conversation_panel.py'
      - 'baton_model_bridge.py'
      - 'baton_core_window.py'
      - 'test_baton_help_*.py'
      - '.github/workflows/baton-dynamic-help.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help-ui-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt offscreen native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0
      - name: Install Qt Widgets
        run: python3 -m pip install --disable-pip-version-check 'PySide6>=6.8,<6.12'
      - name: Headless dynamic HOWTO FAQ and existing bridge controls
        run: |
          python3 -W error::ResourceWarning -m unittest -v \
            test_baton_help_catalog.py test_baton_help_ui.py \
            test_baton_model_bridge.py test_baton_conversation_panel.py
