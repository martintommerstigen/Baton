name: Remote envelope regression
on:
  push:
    paths:
      - 'remote_security/**'
      - 'tools/gtrcm_branch_audit.py'
      - 'tests/test_gtrcm_branch_audit.py'
      - 'tests/test_research_jobs.py'
      - 'tests/test_pinned_source.py'
      - 'tests/test_pinned_source_bundle.py'
      - 'tests/test_source_broker*.py'
      - 'tests/test_source_broker_client.py'
      - 'tests/test_admission_sender_scope*.py'
      - 'tests/test_host_manifest.py'
      - 'deploy/systemd/**'
      - 'tests/test_remote_*.py'
      - 'tests/test_pause_guard.py'
      - 'tests/test_http_*.py'
      - 'tests/test_receipt_audit.py'
      - '.github/workflows/remote-envelope.yml'
  pull_request:
    paths:
      - 'remote_security/**'
      - 'tools/gtrcm_branch_audit.py'
      - 'tests/test_gtrcm_branch_audit.py'
      - 'tests/test_research_jobs.py'
      - 'tests/test_pinned_source.py'
      - 'tests/test_pinned_source_bundle.py'
      - 'tests/test_source_broker*.py'
      - 'tests/test_source_broker_client.py'
      - 'tests/test_admission_sender_scope*.py'
      - 'tests/test_host_manifest.py'
      - 'deploy/systemd/**'
      - 'tests/test_remote_*.py'
      - 'tests/test_pause_guard.py'
      - 'tests/test_http_*.py'
      - 'tests/test_receipt_audit.py'
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q remote_security tests
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
      # Only on trusted branch pushes: the fork-based SO_PEERCRED regression
      # needs root to create two *different* real Linux UIDs. Never run PR
      # supplied code as root, and never use production secrets.
      - name: Isolated two-UID kernel credential regression
        if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
        run: sudo "$(command -v python)" -W error::ResourceWarning -m unittest discover -s tests -p 'test_source_broker.py' -v
      - name: Real cross-UID pinned-source capture and restart audit
        if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
        run: sudo "$(command -v python)" -W error::ResourceWarning -m unittest discover -s tests -p 'test_source_broker_cross_uid_e2e.py' -v
      - name: Read-only source probe real-UID zero-payload regression
        if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
        run: sudo "$(command -v python)" -W error::ResourceWarning -m unittest discover -s tests -p 'test_source_broker_probe_cross_uid.py' -v
      - name: Separate-UID retirement candidate quarantine (no UI send)
        if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
        run: sudo "$(command -v python)" -W error::ResourceWarning -m unittest discover -s tests -p 'test_retirement_quarantine_cross_uid.py' -v

      - name: Separate-UID asserted-sender binding (no ChatGPT authorship claim)
        if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
        run: sudo "$(command -v python)" -W error::ResourceWarning -m unittest discover -s tests -p 'test_admission_sender_scope_cross_uid.py' -v
