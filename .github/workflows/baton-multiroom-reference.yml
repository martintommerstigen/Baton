name: Baton multiroom consent and external port references

on:
  push:
    branches:
      - feature/multiroom-consent-ports-2026-11-13
    paths:
      - 'baton_multiroom_*.py'
      - 'baton_outbound_ports_reference.py'
      - 'baton_conversation_panel.py'
      - 'baton_core_window.py'
      - 'baton_help_catalog.py'
      - 'test_baton_multiroom_*.py'
      - 'test_baton_outbound_ports_reference.py'
      - '.github/workflows/baton-multiroom-reference.yml'
  pull_request:
    paths:
      - 'baton_multiroom_*.py'
      - 'baton_outbound_ports_reference.py'
      - 'baton_conversation_panel.py'
      - 'baton_core_window.py'
      - 'baton_help_catalog.py'
      - 'test_baton_multiroom_*.py'
      - 'test_baton_outbound_ports_reference.py'
      - '.github/workflows/baton-multiroom-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0
          python3 -m pip install --disable-pip-version-check 'PySide6>=6.8,<6.12'
      - name: Negative controls and native UI checks
        run: |
          python3 -W error::ResourceWarning -m unittest -v \
            test_baton_multiroom_reference.py \
            test_baton_outbound_ports_reference.py \
            test_baton_multiroom_ui.py \
            test_baton_action_authority_reference.py \
            test_baton_continuity_floor_reference.py \
            test_baton_forum_reference.py
