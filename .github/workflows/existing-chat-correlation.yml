name: Baton existing-chat reply correlation controls

on:
  push:
    branches:
      - fix/strict-existing-chat-reply-correlation-2026-11-12
    paths:
      - 'baton_chat_observe.py'
      - 'baton_model_bridge.py'
      - 'test_baton_delivery_correlation.py'
      - '.github/workflows/existing-chat-correlation.yml'
  pull_request:
    paths:
      - 'baton_chat_observe.py'
      - 'baton_model_bridge.py'
      - 'test_baton_delivery_correlation.py'
      - '.github/workflows/existing-chat-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile
        run: python3 -m py_compile baton_chat_observe.py baton_model_bridge.py test_baton_delivery_correlation.py
      - name: Existing-chat negative controls
        run: python3 -m unittest -v test_baton_delivery_correlation.py test_baton_chat_observe.py test_baton_model_bridge.py
