name: Ronja R26 sealed Unix channel negative controls
on:
  push:
    branches:
      - research/ronja-r26-sealed-unix-channel-2026-11-11
    paths:
      - 'remote_security/sealed_unix_channel.py'
      - 'tests/test_sealed_unix_channel.py'
      - '.github/workflows/ronja-r26-sealed-unix.yml'
  pull_request:
    paths:
      - 'remote_security/sealed_unix_channel.py'
      - 'tests/test_sealed_unix_channel.py'
      - '.github/workflows/ronja-r26-sealed-unix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact source
        run: python3 -m compileall -q remote_security/sealed_unix_channel.py tests/test_sealed_unix_channel.py
      - name: Cross-UID Linux kernel tests (no Greg, no browser)
        run: sudo python3 -m unittest discover -s tests -p 'test_sealed_unix_channel.py' -v
