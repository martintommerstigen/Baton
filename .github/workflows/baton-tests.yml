name: Baton Python regression tests

on:
  push:
    paths:
      - 'server.py'
      - 'client.py'
      - 'wake_contract.py'
      - 'wake_adapter.py'
      - 'wake_ui_lock.py'
      - 'chatgpt_ui_driver.py'
      - 'run_chatgpt_wake.py'
      - 'wake_chain.py'
      - 'wake_origin.py'
      - 'run_chatgpt_wake_chain.py'
      - 'simulate_wake_chain.py'
      - 'inspect_chatgpt_wake_ui.py'
      - 'test_*.py'
      - '.github/workflows/baton-tests.yml'
  pull_request:
    paths:
      - 'server.py'
      - 'client.py'
      - 'wake_*.py'
      - 'chatgpt_ui_driver.py'
      - 'run_chatgpt_wake.py'
      - 'run_chatgpt_wake_chain.py'
      - 'inspect_chatgpt_wake_ui.py'
      - 'test_*.py'
      - '.github/workflows/baton-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python version
        run: python3 --version
      - name: Compile Python modules
        run: python3 -m compileall -q .
      - name: Offline A-B-C simulation
        run: python3 simulate_wake_chain.py
      - name: Baton regression tests
        run: python3 -m unittest -v test_baton.py test_security.py test_client.py test_wake_contract.py test_wake_adapter.py test_chatgpt_ui_driver.py test_chatgpt_ui_driver_marker.py test_chatgpt_ui_observation.py test_chatgpt_ui_submission.py test_run_chatgpt_wake.py test_wake_chain.py test_wake_origin.py test_run_chatgpt_wake_chain.py test_receipt_commit_order.py test_inspect_chatgpt_wake_ui.py test_wake_browser_integration.py test_wake_digest.py test_wake_collision.py test_wake_presend_abort.py test_wake_ui_lock.py
