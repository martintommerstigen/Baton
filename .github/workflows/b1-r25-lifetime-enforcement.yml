name: B1 H24 Ronja R25 lifetime enforcement
on:
  push:
    branches:
      - feature/b1-r25-lifetime-enforcement-2026-11-11
  pull_request:
    paths:
      - 'run_b1_snapshot_observer.py'
      - 'test_b1_r25_lifetime_entry.py'
      - '.github/workflows/b1-r25-lifetime-enforcement.yml'
jobs:
  linux-lifetime-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Ronja R25 (includes R24/R23) at verified source commit
        uses: actions/checkout@v4
        with:
          repository: martintommerstigen/Baton
          ref: 4366521d2194ca936d1fb46bf0a29fcf40dce196
          path: .b5-r25
          persist-credentials: false
      - name: Pin Ronja R23 frame credentials for cross-UID snapshot test
        uses: actions/checkout@v4
        with:
          repository: martintommerstigen/Baton
          ref: 961f49a7230c65e479cb252a33a38fee634b5a2e
          path: .b5-r23
          persist-credentials: false
      - name: Check actual libseccomp dependency
        run: ldconfig -p | grep 'libseccomp.so.2'
      - name: Compile and run B1 R25 direct-entry, kernel, R24 and snapshot negatives
        env:
          PYTHONPATH: ${{ github.workspace }}/.b5-r25:${{ github.workspace }}/.b5-r23:${{ github.workspace }}
        run: |
          python3 -m py_compile run_b1_snapshot_observer.py
          python3 -m unittest -v test_b1_r25_lifetime_entry.py test_b1_r24_observer_preflight.py test_b1_snapshot_relay.py
      - name: Cross-UID snapshot transport (synthetic source, real Linux UIDs)
        env:
          PYTHONPATH: ${{ github.workspace }}/.b5-r25:${{ github.workspace }}/.b5-r23:${{ github.workspace }}
        run: sudo env PYTHONPATH="$PYTHONPATH" python3 -m unittest -v test_b1_snapshot_kernel.py
