name: Baton local terminal smoke tests
on:
  push:
    branches:
      - feature/evening-local-terminal-2026-11-10
    paths:
      - baton_local_terminal.py
      - test_baton_local_terminal.py
      - desktop/preflight_greg.py
      - test_preflight_greg.py
      - baton_loopback_http.py
      - test_baton_loopback_http.py
      - baton_mcp.py
      - baton_github_bus.py
      - baton_wake_claim.py
      - test_baton_wake_claim.py
      - baton_wake_queue.py
      - test_baton_wake_queue.py
      - baton_chatgpt_view.py
      - test_baton_chatgpt_view.py
      - baton_update_preflight.py
      - test_baton_update_preflight.py
      - baton_wake_receipt.py
      - test_baton_wake_receipt.py
      - install_baton_greg_service.sh
      - test_baton_github_bus.py test_baton_exec_agent.py test_baton_local_api.py test_baton_mcp_stdio.py
      - test_baton_mcp.py
      - test_greg_mcp_http_e2e.sh
      - install_evening.sh
      - .github/workflows/local-terminal.yml
  pull_request:
    paths:
      - baton_local_terminal.py
      - test_baton_local_terminal.py
      - desktop/preflight_greg.py
      - test_preflight_greg.py
      - baton_loopback_http.py
      - test_baton_loopback_http.py
      - baton_mcp.py
      - test_baton_mcp.py
      - test_greg_mcp_http_e2e.sh
      - install_evening.sh
      - .github/workflows/local-terminal.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_baton_local_terminal.py test_preflight_greg.py test_baton_loopback_http.py test_baton_mcp.py test_baton_github_bus.py test_baton_wake_receipt.py test_baton_update_preflight.py test_baton_chatgpt_view.py test_baton_wake_queue.py test_baton_wake_claim.py
      - run: bash -n install_evening.sh install_baton_greg_service.sh test_greg_mcp_http_e2e.sh
      - run: BATON_WORKTREE="$PWD" bash test_greg_mcp_http_e2e.sh
      - run: python3 baton_local_terminal.py identity --workspace .
      - run: python3 baton_local_terminal.py git-revision --workspace .
