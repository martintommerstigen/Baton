name: Baton dynamic peer learning index reference

on:
  push:
    branches:
      - feature/dynamic-peer-learning-ledger-2026-11-12
    paths:
      - 'baton_learning_index_reference.py'
      - 'baton_learning_index_seed.py'
      - 'test_baton_learning_index_reference.py'
      - 'baton_forum_reference.py'
      - 'test_baton_forum_reference.py'
      - 'baton_continuity_floor_reference.py'
      - 'test_baton_continuity_floor_reference.py'
      - '.github/workflows/baton-learning-index-reference.yml'
  pull_request:
    paths:
      - 'baton_learning_index_reference.py'
      - 'baton_learning_index_seed.py'
      - 'test_baton_learning_index_reference.py'
      - '.github/workflows/baton-learning-index-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile isolated references
        run: |
          python3 -m py_compile \
            baton_learning_index_reference.py baton_learning_index_seed.py \
            baton_forum_reference.py baton_continuity_floor_reference.py \
            test_baton_learning_index_reference.py
      - name: Negative controls (no ChatGPT network, UI writes or effect execution)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest -v \
            test_baton_learning_index_reference.py \
            test_baton_forum_reference.py \
            test_baton_continuity_floor_reference.py
