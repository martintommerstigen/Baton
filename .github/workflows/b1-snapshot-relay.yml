name: B1 restricted existing-chat source snapshot relay
on:
  push:
    branches:
      - feature/b1-snapshot-only-relay-2026-11-11
  pull_request:
    paths:
      - 'b1_snapshot_relay.py'
      - 'run_b1_snapshot_collector.py'
      - 'run_b1_snapshot_observer.py'
      - 'test_b1_snapshot_relay.py'
      - 'test_b1_snapshot_kernel.py'
      - '.github/workflows/b1-snapshot-relay.yml'
jobs:
  snapshot-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Ronja R23 security implementation
        uses: actions/checkout@v4
        with:
          repository: martintommerstigen/Baton
          ref: 961f49a7230c65e479cb252a33a38fee634b5a2e
          path: .b5-r23
          persist-credentials: false
      - name: Compile and B1 snapshot-only offline negatives
        run: |
          python3 -m py_compile b1_snapshot_relay.py run_b1_snapshot_collector.py run_b1_snapshot_observer.py
          python3 -m unittest -v test_b1_snapshot_relay.py
      - name: Actual Linux cross-UID snapshot relay (synthetic source, no browser)
        env:
          PYTHONPATH: ${{ github.workspace }}/.b5-r23:${{ github.workspace }}
        run: sudo env PYTHONPATH="$PYTHONPATH" python3 -m unittest -v test_b1_snapshot_kernel.py
