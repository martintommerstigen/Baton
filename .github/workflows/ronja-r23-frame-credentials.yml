name: Ronja R23 per-frame Linux credentials
on:
  push:
    branches:
      - research/ronja-r23-frame-credentials-2026-11-11
  pull_request:
    paths:
      - remote_security/frame_credentials.py
      - tests/test_frame_credentials.py
      - tests/test_frame_b1_contract.py
      - tests/test_frame_b1_actual_contract.py
      - .github/workflows/ronja-r23-frame-credentials.yml
jobs:
  unprivileged:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: martintommerstigen/Baton
          ref: feature/b1-r22-readonly-source-observer-2026-11-11
          path: pinned-b1-h21
          persist-credentials: false
      - name: B5 frame and actual B1 SQLite contract (no UI)
        env:
          B1_H21_BROKER: ${{ github.workspace }}/pinned-b1-h21/wake_admission_broker.py
        run: python3 -m unittest discover -s tests -p 'test_frame*.py' -v
  privileged-kernel:
    if: github.event_name == 'push' && github.repository == 'martintommerstigen/Baton'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Linux separate-UID/fork negative controls (trusted push only)
        run: sudo python3 -m unittest discover -s tests -p 'test_frame_credentials.py' -v
